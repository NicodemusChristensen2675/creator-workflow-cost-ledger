[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-workflow-cost-ledger"
version = "0.1.0"
description = "Measure model cost for content processing, asset delivery, and subscriber updates."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.40,<2",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
